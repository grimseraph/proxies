name: "Auto Collect and Refresh Proxies"

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Executable Permissions
        run: |
          chmod +x clash/clash-linux-amd
          chmod +x subconverter/subconverter-linux-amd

      - name: Run Fast Collect and Refresh
        run: |
          python -u subscribe/collect.py -r -t clash mixed -m 20 -d 2000

      - name: Generate Standard Base64 v2ray.txt
        run: |
          if [ -f data/mixed.txt ]; then
            base64 -w 0 data/mixed.txt > data/v2ray.txt
            rm -f data/mixed.txt
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxies-config
          path: |
            data/clash.yaml
            data/v2ray.txt
          retention-days: 30

      - name: Deploy to Output Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p /tmp/proxy_output
          cp -f data/clash.yaml /tmp/proxy_output/ 2>/dev/null || true
          cp -f data/v2ray.txt /tmp/proxy_output/ 2>/dev/null || true
          
          if git ls-remote --exit-code --heads origin output; then
            git checkout output
            git pull origin output
          else
            git checkout --orphan output
            git rm -rf .
          fi
          
          cp -f /tmp/proxy_output/* .
          
          echo "# 节点订阅链接 / Subscription Links" > README.md
          echo "" >> README.md
          echo "本分支由 GitHub Actions 自动维护，包含常规版与香港专线特供版两套独立订阅。" >> README.md
          echo "" >> README.md
          echo "### 🌐 常规版（全球低延迟 20 节点混合）：" >> README.md
          echo "- **Clash 订阅**: https://raw.githubusercontent.com/${{ github.repository }}/output/clash.yaml" >> README.md
          echo "- **v2ray 订阅 (Base64)**: https://raw.githubusercontent.com/${{ github.repository }}/output/v2ray.txt" >> README.md
          echo "" >> README.md
          echo "### 🇭🇰 香港专线特供版（保底 >= 5 个香港低延迟优质节点）：" >> README.md
          echo "- **Clash 香港专线**: https://raw.githubusercontent.com/${{ github.repository }}/output/clash_hk.yaml" >> README.md
          echo "- **v2ray 香港专线 (Base64)**: https://raw.githubusercontent.com/${{ github.repository }}/output/v2ray_hk.txt" >> README.md
          echo "" >> README.md
          echo "最后更新时间 (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" >> README.md
          
          git add clash.yaml v2ray.txt README.md
          
          if git diff --staged --quiet; then
            echo "No changes in proxy nodes, skip commit."
          else
            git commit -m "Auto update proxies: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin output
          fi
