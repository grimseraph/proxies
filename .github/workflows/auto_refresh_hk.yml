name: "Auto Collect and Refresh Proxies 2 - HK Special"

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Executable Permissions
        run: |
          chmod +x clash/clash-linux-amd
          chmod +x subconverter/subconverter-linux-amd

      - name: Run Fast Collect with HK Guard (Min 5 HK nodes)
        run: |
          python -u subscribe/collect.py -r -t clash mixed -m 20 -d 3500 --min-hk 5

      - name: Prepare HK Dedicated Files
        run: |
          cp -f data/clash.yaml data/clash_hk.yaml 2>/dev/null || true
          
          if [ -f data/mixed.txt ]; then
            mv -f data/mixed.txt data/v2ray_hk.txt
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxies-config-hk
          path: |
            data/clash_hk.yaml
            data/v2ray_hk.txt
          retention-days: 30

      - name: Deploy HK Files to Output Branch
        run: |
          mkdir -p /tmp/proxy_output_hk
          cp -f data/clash_hk.yaml /tmp/proxy_output_hk/ 2>/dev/null || true
          cp -f data/v2ray_hk.txt /tmp/proxy_output_hk/ 2>/dev/null || true

          # 克隆 output 分支到独立目录，若不存在则初始化
          rm -rf /tmp/output_repo
          if git clone --depth 1 --branch output "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/output_repo 2>/dev/null; then
            cd /tmp/output_repo
          else
            mkdir -p /tmp/output_repo
            cd /tmp/output_repo
            git init
            git checkout -b output
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 拷贝专线文件（只覆盖自身，保留常规文件）
          cp -f /tmp/proxy_output_hk/* .

          echo "# 节点订阅链接 / Subscription Links" > README.md
          echo "" >> README.md
          echo "本分支由 GitHub Actions 自动维护，包含常规版与香港专线特供版两套独立订阅。" >> README.md
          echo "" >> README.md
          echo "### 🇭🇰 香港专线特供版（保底 >= 5 个香港低延迟节点）：" >> README.md
          echo "- **Clash 香港专线**: https://raw.githubusercontent.com/${{ github.repository }}/output/clash_hk.yaml" >> README.md
          echo "- **v2ray 香港专线 (Base64)**: https://raw.githubusercontent.com/${{ github.repository }}/output/v2ray_hk.txt" >> README.md
          echo "" >> README.md
          echo "### 🌐 常规版（全球低延迟 20 节点混合）：" >> README.md
          echo "- **Clash 常规订阅**: https://raw.githubusercontent.com/${{ github.repository }}/output/clash.yaml" >> README.md
          echo "- **v2ray 常规订阅 (Base64)**: https://raw.githubusercontent.com/${{ github.repository }}/output/v2ray.txt" >> README.md
          echo "" >> README.md
          echo "最后更新时间 (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" >> README.md

          git add clash_hk.yaml v2ray_hk.txt README.md

          if git diff --staged --quiet; then
            echo "No changes in HK proxy nodes, skip commit."
          else
            git commit -m "Auto update HK proxies: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push -u origin output
          fi
